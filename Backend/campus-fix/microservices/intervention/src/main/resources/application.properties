spring.application.name=intervention-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campusfix_intervention
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.campusfix.intervention=INFO