spring.application.name=lost-found-test

spring.datasource.url=jdbc:h2:mem:lostfound_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Eureka discovery in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

integration.mock-enabled=true
integration.user-service.url=http://localhost:8081
integration.room-service.url=http://localhost:8082
integration.event-service.url=http://localhost:8084
