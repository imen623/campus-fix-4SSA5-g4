spring.application.name=lost-found
server.port=8085

# MySQL Configuration for XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/lostfound_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inter-service integration switch (mock enabled for standalone run)
integration.mock-enabled=true
integration.user-service.url=http://localhost:8081
integration.room-service.url=http://localhost:8082
integration.event-service.url=http://localhost:8084

# Eureka Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# Spring Boot Actuator & Info
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=lost-found
info.app.version=1.0.0
info.app.description=Microservice de gestion des objets perdus et retrouves, declarations et restitutions
info.app.team=4SSA5-Groupe4

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
